# ============================================================================
# Ticket Service — стенд для VPS / локальной разработки
#
# Быстрый старт (HTTP на :8080):
#   cp .env.example .env          # задайте TICKETS_API_KEY и CORS_ORIGINS
#   docker compose up -d --build
#   curl http://localhost:8080/health
#
# С HTTPS (нужен домен, DNS → IP VPS):
#   в .env: DOMAIN=api.example.com  CORS_ORIGINS=https://app.example.com
#   docker compose --profile https up -d --build
#
# Опциональный Redis-кэш:
#   docker compose --profile cache up -d
# ============================================================================

services:
  db:
    image: postgres:16-alpine
    container_name: tickets-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tickets_db}
      POSTGRES_USER: ${POSTGRES_USER:-tickets_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tickets_pass}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    # БД только внутри docker-сети (не торчит в интернет).
    # Для локальной отладки с хоста раскомментируйте:
    # ports:
    #   - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - tickets

  redis:
    image: redis:7-alpine
    container_name: tickets-redis
    command: ["redis-server", "--appendonly", "no"]
    profiles: ["cache"]
    # Не публикуем порт наружу — только для сервиса app
    restart: unless-stopped
    networks:
      - tickets

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ticket-service:1.0.0
    container_name: ticket-service
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      TICKETS_DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-tickets_app}:${POSTGRES_PASSWORD:-tickets_pass}@db:5432/${POSTGRES_DB:-tickets_db}
      TICKETS_HOST: 0.0.0.0
      TICKETS_PORT: "8080"
      # Публичный URL API (для Swagger). При profile https — https://DOMAIN
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      CORS_ALLOW_CREDENTIALS: ${CORS_ALLOW_CREDENTIALS:-0}
      TICKETS_API_KEY: ${TICKETS_API_KEY:-gateway-secret-key}
      ACCESS_CONTROL_API_KEY: ${ACCESS_CONTROL_API_KEY:-service-secret-key}
      ACCESS_CONTROL_URL: ${ACCESS_CONTROL_URL:-}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-1}
      AUTO_CREATE_SCHEMA: ${AUTO_CREATE_SCHEMA:-1}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_JSON: ${LOG_JSON:-0}
      CACHE_ENABLED: ${CACHE_ENABLED:-1}
      REDIS_URL: ${REDIS_URL:-}
      NOTIFICATIONS_ENABLED: ${NOTIFICATIONS_ENABLED:-1}
      NOTIFICATION_WEBHOOK_URL: ${NOTIFICATION_WEBHOOK_URL:-}
    # Без Caddy: API доступен снаружи на порту 8080
    ports:
      - "${TICKETS_PUBLISH_PORT:-8080}:8080"
    volumes:
      - ./logs:/srv/ticket-service/logs
    restart: unless-stopped
    networks:
      - tickets

  # HTTPS reverse-proxy (Let's Encrypt). Профиль: https
  # Требует DOMAIN в .env и DNS A-запись на IP VPS.
  caddy:
    image: caddy:2-alpine
    container_name: tickets-caddy
    profiles: ["https"]
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    networks:
      - tickets

volumes:
  pgdata:
  caddy_data:
  caddy_config:

networks:
  tickets:
    driver: bridge
